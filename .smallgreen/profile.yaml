# Second Brain（Cloudflare）適配契約（Path C，keyword-only 降級版）。上游程式碼不在本 repo——組裝流程見 AGENTS.md。
schema_version: "0.3.0"
profile: small-app
summary:
  purpose: 自架個人知識庫（筆記擷取、關鍵字檢索、知識圖譜、MCP server），資料存自己帳號的 D1
  audience: 個人知識管理與 AI 助手記憶後端
  users_estimate: 1-10
upstream:
  repo: rahilp/second-brain-cloudflare
  commit: 4e5424efae99e9666d4aa901f1ad2715bac0cb13
  license: MIT
login_method: token
data:
  types: [notes, knowledge_graph]
  stored_in: [d1, kv]
  notes: 筆記與知識圖譜存 D1（珍貴資料）；OAUTH_KV 存 MCP OAuth 狀態。本 adapter 為 keyword-only 降級版——Vectorize binding 已由 patch 移除（token 無 Vectorize 權限的帳號適配，B run E43）：語意搜尋降為關鍵字搜尋（上游讀路徑原生 fallback），寫路徑由 patch 0002 改為「binding 不存在才跳過」（上游 E44 缺口——lifecycle 有防呆但 store/duplicate/traverse 沒有；binding 在位時錯誤照常傳播，上游 981 個測試零改動全綠）。副作用：語意去重與向量鄰居邊推斷停用；降級模式下擷取的筆記 vector_ids 記為空，落入上游既有的 unvectorized 回補集合；`/migration/reembed` 回 503 而非假成功。嵌入與 LLM 走 Workers AI（10k Neurons/day，**帳號層共用**）——**此降級只擺脫 Vectorize，未擺脫 Workers AI**：擷取與檢索兩條路徑都在 try 之外呼叫 embed()／inferQueryTags()，Neurons 用盡時兩者皆 500（C-02 run 實測，故引導新增部署前的額度探針）
secrets:
  - name: AUTH_TOKEN
    purpose: API 與 MCP 存取 token（必要——所有寫入端點的認證）
    required: true
    how_to_obtain: 自行產生 32+ 字元亂數
    free_tier: true
  - name: VECTORIZE
    purpose: 選配——上游 Vectorize binding（本 adapter patch 已移除；列此供 CON-3 靜態掃描對帳。帳號 token 有 Vectorize 權限時還原 patch 0001 即回復語意搜尋）
    required: false
    how_to_obtain: 還原 patch 後 wrangler 部署時 auto-provision（注意 E45：中途失敗不寫回 ID，重跑撞 already exists）
    free_tier: true
  - name: SECOND_BRAIN_URL
    purpose: 選配——客戶端整合（claude-code hooks）指向自己部署 URL 的環境變數（非 worker runtime。列此供 CON-3 對帳）
    required: false
    how_to_obtain: 設為部署後的 workers.dev URL
    free_tier: true
  - name: SECOND_BRAIN_TOKEN
    purpose: 選配——客戶端整合的 AUTH_TOKEN 副本（非 worker runtime。列此供 CON-3 對帳）
    required: false
    how_to_obtain: 同 AUTH_TOKEN 值
    free_tier: true
external_services: []
alt_deployment: []
build_requirements:
  runtime: node>=22
  package_manager: npm
  gates:
    - npx wrangler types
    - npx tsc --noEmit
    - npm test
  notes: |
    順序不可調換——tsc 依賴 wrangler types 生成的 worker-configuration.d.ts（生成物不入庫）。
    降級模式（patch 0001 移除 binding）下生成型別不再含 VECTORIZE，故 patch 0002 於 src/env.ts
    將其宣告為選配；兩種模式皆須 tsc 零錯誤，這也是下次上游同步時新增呼叫點的偵測機制
    （未處理的 env.VECTORIZE 會是型別錯誤，不必靠 grep 巡檢）。
